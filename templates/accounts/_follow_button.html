<form method="post" action="{% url 'follow_toggle' username %}" class="follow-form" data-follow-form>{% csrf_token %}<button type="submit" class="button button-small follow-button {% if i_follow %}is-following{% else %}button-primary{% endif %}" data-following="{{ i_follow|yesno:'true,false' }}" data-follows-me="{{ follows_me|yesno:'true,false' }}">{% if is_friend %}Friends{% elif i_follow %}Following{% elif follows_me %}Follow back{% else %}Follow{% endif %}</button></form>
