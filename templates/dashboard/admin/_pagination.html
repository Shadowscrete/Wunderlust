{% if page_obj.paginator.num_pages > 1 %}<nav class="admin-pagination" aria-label="Pages">
    {% if page_obj.has_previous %}<a class="button button-secondary" href="?{% if qs %}{{ qs }}&{% endif %}page={{ page_obj.previous_page_number }}">← Previous</a>{% else %}<span></span>{% endif %}
    <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }} · {{ page_obj.paginator.count }} total</span>
    {% if page_obj.has_next %}<a class="button button-secondary" href="?{% if qs %}{{ qs }}&{% endif %}page={{ page_obj.next_page_number }}">Next →</a>{% else %}<span></span>{% endif %}
</nav>{% endif %}
