<details{% if edit_form.errors %} open{% endif %}>
    <summary class="text-button">Edit<span class="sr-only"> {{ object }}</span></summary>
    <form method="post" class="feature-form compact-form">
        {% csrf_token %}
        <input type="hidden" name="action" value="{{ action }}">
        <input type="hidden" name="{{ id_field }}" value="{{ object.pk }}">
        {{ edit_form.non_field_errors }}
        {% for field in edit_form %}
            <div class="form-field">{{ field.label_tag }}{{ field }}
                {% for error in field.errors %}<span class="field-error">{{ error }}</span>{% endfor %}
            </div>
        {% endfor %}
        <button type="submit" class="button button-secondary">Save changes</button>
    </form>
</details>
